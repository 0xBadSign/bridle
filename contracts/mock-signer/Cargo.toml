[package]
name = "bridle-mock-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sandbox-only stand-in for the NEAR MPC signer and its foreign-transaction attestations. Never deploy outside a local sandbox."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bridle-core = { path = "../../crates/bridle-core" }
near-sdk.workspace = true
hex.workspace = true
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
